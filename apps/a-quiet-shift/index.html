<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#222326">
    <title>Play A Quiet Shift | Wesley Tan</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        .quiet-stage { display: grid; place-items: center; aspect-ratio: 16 / 10; background: #080a0c; margin-top: 1rem; }
        .quiet-stage canvas { width: 100%; height: 100%; display: block; }
        .quiet-stage:fullscreen canvas { width: min(100vw, calc(100vh * 16 / 10)); height: auto; aspect-ratio: 16 / 10; }
        #load-progress { width: min(100%, 26rem); margin-top: 1rem; accent-color: var(--accent); }
    </style>
</head>
<body>
    <a class="skip-link" href="#game">Skip to game</a>
    <main class="wrap">
        <div class="page-lead">
            <a class="back" href="../../a-quiet-shift.html">Back to A Quiet Shift</a>
            <h1>Play A Quiet Shift</h1>
            <p class="intro">Enable your microphone for sound detection. This build downloads about 274 MB on first load.</p>
        </div>
        <section class="section reading" id="game" aria-labelledby="game-title">
            <h2 id="game-title">Game display</h2>
            <div class="actions">
                <button class="button primary" id="start" type="button">Start A Quiet Shift</button>
                <button class="button" id="microphone" type="button">Enable microphone</button>
                <button class="button" id="fullscreen" type="button" disabled>Fullscreen</button>
            </div>
            <p id="mic-status" role="status"></p>
            <p id="status" role="status"></p>
            <progress id="load-progress" max="1" value="0" aria-label="Game load progress" hidden></progress>
            <div class="quiet-stage">
                <canvas id="unity-canvas" width="960" height="600" tabindex="0" aria-label="A Quiet Shift game display"></canvas>
            </div>
        </section>
    </main>
    <script src="play.js" defer></script>
</body>
</html>
